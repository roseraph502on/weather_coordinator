<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER CODI APP</title>
      <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/024/825/180/non_2x/3d-weather-icon-day-free-png.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://i.pinimg.com/1200x/5a/01/81/5a0181d2333f4cf6f260253dfcb392df.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            max-height: 100vh;
        }
        .weather-container {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .city-name { font-size: 24px; color: #222; margin-bottom: 5px; }
        .temp-display { font-size: 54px; font-weight: 300; color: #111; }
        
        .tag-container { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .style-tag {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            transition: all 0.2s ease;
        }
        .style-tag.active {
            background: #2c444e !important;
            color: #ffffff !important;
            font-weight: bold;
        }
        
        .section-title {
            text-align: center;
            color: #2c444e;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .outfit-slider-card {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .slider-img {
            height: 35vh;
            display: block;
            margin: 0 auto;
            padding: 20px;
            object-fit: cover;
        }
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-2">
        <img src="https://static.vecteezy.com/system/resources/previews/024/825/180/non_2x/3d-weather-icon-day-free-png.png" style="width: 140px; height: auto;" alt="Weather Icon">
    </div>

    <div class="weather-container shadow-sm">
        <div class="city-name">{{ city }}</div>
        <div class="temp-display">{{ temp }}°C</div>
        
        <div class="tag-container">
            <button class="style-tag {% if current_style == 'Lovely' %}active{% endif %}" onclick="changeStyle('Lovely')">Lovely</button>
            <button class="style-tag {% if current_style == 'Office' %}active{% endif %}" onclick="changeStyle('Office')">Office</button>
            <button class="style-tag {% if current_style == 'Hip' %}active{% endif %}" onclick="changeStyle('Hip')">Hip</button>
            <button class="style-tag {% if current_style == 'Casual' %}active{% endif %}" onclick="changeStyle('Casual')">Casual</button>
        </div>
    </div>

    <div style="max-width: 450px; margin: 15px auto;">
        <div class="p-3 rounded-4 bg-white bg-opacity-75 text-secondary shadow-sm text-center small fw-medium">
            🤖 AI 요약: "{{ ai_briefing }}"
        </div>
    </div>

    <h2 class="section-title">RECOMMENDED COORDINATION</h2>

    <div id="outfitCarousel" class="carousel slide outfit-slider-card shadow" data-bs-ride="carousel">
        <div class="carousel-inner" id="carousel-content">
            <div class="loading-box">
                <div class="spinner-border text-secondary mb-3" role="status"></div>
                <div class="fw-bold small">핀터레스트 실시간 검색 매칭 중...</div>
            </div>
        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#outfitCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true" style="filter: invert(1);"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#outfitCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true" style="filter: invert(1);"></span>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
     // 스타일 변경 시 GET 파라미터 변경 후 새로고침 조작
    function changeStyle(styleName) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('style', styleName);
        window.location.href = window.location.pathname + '?' + urlParams.toString();
    }

    // 🚀 페이지 오픈 시 핀터레스트 실시간 갱신 이미지 비동기 바인딩
    document.addEventListener("DOMContentLoaded", function() {
        const season = "{{ season|escapejs }}";
        const style = "{{ current_style|escapejs }}";
        const targetContainer = document.getElementById("carousel-content");

        console.clear();
        console.log("%c[📡 이미지 전용 비동기 로더 가동]", "color: white; background: #007bff; padding: 4px 8px; border-radius: 4px; font-weight: bold;");

        // 오직 백엔드 실시간 매칭 API 한 곳만 바라보도록 통합
        fetch(`/get-outfits/?season=${encodeURIComponent(season)}&style=${encodeURIComponent(style)}`)
            .then(response => {
                if (!response.ok) throw new Error("서버 통신 상태 불량");
                return response.json();
            })
            .then(data => {
                const outfits = data.outfits;
                
                // 검색된 데이터가 아예 없을 때의 프론트 처리
                if (!outfits || outfits.length === 0) {
                    targetContainer.innerHTML = `<div class="p-5 text-center text-muted small">추천 의상을 찾지 못했습니다.</div>`;
                    return;
                }

                // 획득한 고화질 순수 .jpg 리스트로 슬라이더 아이템 빌드
                let htmlContent = "";
                outfits.forEach((imgUrl, index) => {
                    const activeClass = index === 0 ? "active" : "";
                    htmlContent += `
                        <div class="carousel-item ${activeClass}">
                            <img src="${imgUrl}" class="slider-img" alt="코디" referrerpolicy="no-referrer">
                            <div class="p-3 text-center bg-light border-top">
                                <p class="m-0 text-truncate text-muted small fw-bold">${season} ${style} 검색 매칭 픽 ${index + 1}</p>
                            </div>
                        </div>
                    `;
                });
                
                // 로딩 박스 밀어버리고 빌드한 HTML 깔끔하게 주입
                targetContainer.innerHTML = htmlContent;
                console.log("📊 [매칭 바인딩 완료] 주입된 고화질 JPG 목록:", outfits);
            })
            .catch(error => {
                console.error("🚨 이미지 수급 실패:", error);
                targetContainer.innerHTML = `<div class="p-5 text-center text-danger small">이미지 로딩 중 오류가 발생했습니다.</div>`;
            });
    });
</script>
</body>
</html>
